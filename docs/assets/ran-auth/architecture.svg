<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">基站与核心网的 HMAC 准入架构</title>
  <desc id="desc">登记时基站与 AMF 安全保存同一设备密钥。基站生成身份、时间、随机数和 HMAC 凭据，AMF 根据设备名单及已用随机数记录验证，通过后才允许接入。密钥不通过接入报文发送。</desc>
  <defs>
    <marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2563eb"/></marker>
    <marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker>
    <marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#059669"/></marker>
  </defs>
  <rect width="1200" height="620" rx="20" fill="#f8fafc"/>
  <g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#0f172a">
    <text x="40" y="45" font-size="28" font-weight="700">一眼看懂：基站接入认证</text>
    <text x="40" y="75" font-size="17" fill="#475569">基站提交一次性凭据，核心网核验后才允许接入。</text>
    <rect x="430" y="91" width="340" height="55" rx="12" fill="#fff7ed" stroke="#fdba74"/>
    <text x="600" y="114" font-size="17" text-anchor="middle" fill="#9a3412">登记阶段：每台设备一把独立密钥</text>
    <text x="600" y="135" font-size="14" text-anchor="middle" fill="#9a3412">通过受控方式分别交付给基站与 AMF</text>
    <rect x="40" y="164" width="420" height="338" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="710" y="164" width="450" height="338" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="64" y="195" font-size="21" font-weight="700">基站</text>
    <text x="734" y="195" font-size="21" font-weight="700">核心网 AMF</text>
    <path d="M600 146V208" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/>
    <path d="M600 208H156V226" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#gray)"/>
    <path d="M600 208H826V226" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#gray)"/>
    <rect x="64" y="226" width="184" height="64" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="156" y="253" font-size="19" text-anchor="middle">设备密钥</text>
    <text x="156" y="276" font-size="14" text-anchor="middle" fill="#475569">本地保存，不发送</text>
    <rect x="268" y="226" width="168" height="64" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="352" y="253" font-size="17" text-anchor="middle">身份 + 当前时间</text>
    <text x="352" y="276" font-size="17" text-anchor="middle">新的随机数</text>
    <path d="M156 290V312H250M352 290V312H250" fill="none" stroke="#2563eb" stroke-width="2"/>
    <path d="M250 312V332" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
    <rect x="64" y="332" width="372" height="64" rx="10" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="250" y="371" font-size="20" text-anchor="middle">计算 HMAC，生成本次凭据</text>
    <text x="250" y="441" font-size="18" text-anchor="middle" fill="#334155">密钥留在本地，报文只带凭据</text>
    <text x="250" y="471" font-size="16" text-anchor="middle" fill="#64748b">每次新申请都重新生成</text>
    <path d="M436 364H734" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/>
    <text x="585" y="345" font-size="18" text-anchor="middle" fill="#1d4ed8">接入申请</text>
    <text x="585" y="393" font-size="16" text-anchor="middle" fill="#475569">RANNodeName</text>
    <rect x="734" y="226" width="184" height="64" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="826" y="253" font-size="18" text-anchor="middle">设备名单与密钥</text>
    <text x="826" y="276" font-size="14" text-anchor="middle" fill="#475569">查到该设备的对应密钥</text>
    <rect x="934" y="226" width="200" height="64" rx="10" fill="#f0fdf4" stroke="#86efac"/>
    <text x="1034" y="253" font-size="18" text-anchor="middle">已用随机数记录</text>
    <text x="1034" y="276" font-size="14" text-anchor="middle" fill="#475569">查重，并记住新值</text>
    <path d="M826 290V312H884V332" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#gray)"/>
    <path d="M1034 290V312H984V332" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#gray)"/>
    <rect x="734" y="332" width="400" height="64" rx="10" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="934" y="359" font-size="19" text-anchor="middle">核对身份、HMAC、时间与随机数</text>
    <text x="934" y="383" font-size="15" text-anchor="middle" fill="#475569">随机数未使用过，才继续业务校验</text>
    <path d="M934 396V432" stroke="#059669" stroke-width="2" marker-end="url(#green)"/>
    <rect x="734" y="432" width="400" height="46" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="934" y="461" font-size="19" text-anchor="middle" fill="#047857">全部通过才放行；任一项失败就拒绝</text>
    <rect x="40" y="530" width="352" height="65" rx="12" fill="#eff6ff"/>
    <text x="60" y="557" font-size="20" font-weight="700" fill="#1d4ed8">HMAC：防伪造</text>
    <text x="60" y="582" font-size="15" fill="#475569">没有密钥，就不能生成正确的新凭据</text>
    <rect x="424" y="530" width="352" height="65" rx="12" fill="#fff7ed"/>
    <text x="444" y="557" font-size="20" font-weight="700" fill="#9a3412">时间戳：防过期</text>
    <text x="444" y="582" font-size="15" fill="#475569">旧凭据超过有效时间窗口就失效</text>
    <rect x="808" y="530" width="352" height="65" rx="12" fill="#f0fdf4"/>
    <text x="828" y="557" font-size="20" font-weight="700" fill="#047857">随机数 + 记录：防重复</text>
    <text x="828" y="582" font-size="15" fill="#475569">已使用的值保留记录，不能再次通过</text>
  </g>
</svg>
