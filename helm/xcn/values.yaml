fullnameOverride: xcn

images:
  runtime:
    repository: xcn-runtime
    tag: latest
    pullPolicy: IfNotPresent
  webui:
    repository: xcn-webui
    tag: latest
    pullPolicy: IfNotPresent
  mongodb:
    repository: mongo
    tag: latest
    pullPolicy: IfNotPresent

mongodb:
  persistence:
    enabled: false
    size: 1Gi
    storageClassName: "local-path"

resources:
  core:
    nrf:
      requests:
        cpu: 200m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    scp:
      requests:
        cpu: 200m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  fivegc:
    upf:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 1500m
        memory: 2Gi
    smf:
      requests:
        cpu: 500m
        memory: 256Mi
      limits:
        cpu: 1500m
        memory: 512Mi
    amf:
      requests:
        cpu: 500m
        memory: 256Mi
      limits:
        cpu: 1500m
        memory: 512Mi
    ausf:
      requests:
        cpu: 200m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    udm:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    udr:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 750m
        memory: 512Mi
    nssf:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    pcf:
      requests:
        cpu: 300m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  webui:
    waitForMongodb:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    mongoAdmin:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    webui:
      requests:
        cpu: 200m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  mongodb:
    mongodb:
      requests:
        cpu: 1500m
        memory: 1Gi
      limits:
        cpu: 2500m
        memory: 2Gi

services:
  amfNgap:
    nodePort: 31412
    externalTrafficPolicy: Local
  upfN3:
    nodePort: 32152
    externalTrafficPolicy: Local
  pcfSbi:
    type: NodePort
    nodePort: 30777
    externalTrafficPolicy: Local

fivegc:
  hostNetwork:
    enabled: false
    dnsPolicy: ClusterFirstWithHostNet
  wait:
    timeout: 600
    interval: 2
  startupProbe:
    periodSeconds: 5
    failureThreshold: 120
    timeoutSeconds: 3
  healthProbe:
    readinessPeriodSeconds: 5
    livenessPeriodSeconds: 10
    timeoutSeconds: 3

hostPorts:
  amfNgap:
    enabled: true
    port: 38412
  upfGtpu:
    enabled: true
    port: 2152
  webui:
    enabled: true
    port: 9999

networking:
  amf:
    ngap:
      serverAddress: 0.0.0.0
  upf:
    gtpu:
      # Empty values are resolved to status.podIP at container startup.
      # Do not use 0.0.0.0:2152; it would also capture SMF CP-function GTP-U.
      serverAddress: ""
      advertiseAddress: ""
  webui:
    hostname: 0.0.0.0
    port: 9999

webui:
  secretKey: change-this-open5gs-webui-secret
  jwtSecretKey: change-this-open5gs-webui-jwt-secret

