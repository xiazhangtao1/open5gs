fullnameOverride: xcn

images:
  runtime:
    repository: xcn-runtime
    tag: latest
    pullPolicy: IfNotPresent
  webui:
    repository: xcn-webui
    tag: latest
    pullPolicy: IfNotPresent
  mongodb:
    repository: mongo
    tag: latest
    pullPolicy: IfNotPresent

mongodb:
  persistence:
    enabled: true
    size: 1Gi
    storageClassName: "local-path"

resources:
  core:
    nrf:
      requests:
        cpu: 200m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    scp:
      requests:
        cpu: 200m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  fivegc:
    upf:
      requests:
        cpu: 8
        memory: 4Gi
      limits:
        cpu: 8
        memory: 4Gi
    smf:
      requests:
        cpu: 1
        memory: 256Mi
      limits:
        cpu: 1
        memory: 512Mi
    amf:
      requests:
        cpu: 500m
        memory: 256Mi
      limits:
        cpu: 1500m
        memory: 512Mi
    ausf:
      requests:
        cpu: 200m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    udm:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    udr:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 750m
        memory: 512Mi
    nssf:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    pcf:
      requests:
        cpu: 300m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  webui:
    waitForMongodb:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    mongoAdmin:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    webui:
      requests:
        cpu: 200m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  mongodb:
    mongodb:
      requests:
        cpu: 1500m
        memory: 1Gi
      limits:
        cpu: 2500m
        memory: 2Gi

services:
  amfNgap:
    nodePort: 31412
    externalTrafficPolicy: Local
  upfN3:
    nodePort: 32152
    externalTrafficPolicy: Local
  pcfSbi:
    type: NodePort
    nodePort: 30777
    externalTrafficPolicy: Local

fivegc:
  hostNetwork:
    enabled: false
    dnsPolicy: ClusterFirstWithHostNet
  wait:
    timeout: 600
    interval: 2
  startupProbe:
    periodSeconds: 5
    failureThreshold: 120
    timeoutSeconds: 3
  healthProbe:
    readinessPeriodSeconds: 5
    livenessPeriodSeconds: 10
    timeoutSeconds: 3

hostPorts:
  amfNgap:
    enabled: true
    port: 38412
  upfGtpu:
    enabled: true
    port: 2152
  webui:
    enabled: true
    port: 9999

networking:
  amf:
    ngap:
      serverAddress: 0.0.0.0
  upf:
    dataplane:
      sessionWorkers:
        enabled: false
        count: 1
        queueSize: 8192
    gtpu:
      # Empty values are resolved to status.podIP at container startup.
      # Do not use 0.0.0.0:2152; it would also capture SMF CP-function GTP-U.
      serverAddress: ""
      advertiseAddress: ""
    n3:
      backend: udp
      memif:
        socket: /run/vpp/memif-n3.sock
        socketId: 2
        id: 0
        localAddress: ""
        bufferSize: 2048
        burstSize: 256
        ringSize: 8192
        log2RingSize: 13
        queues: 1
        # UDP checksum is optional for IPv4. Keep disabled on the high-speed
        # N3 memif path; enable only when required by a peer/network policy.
        udpChecksum: false
    n6:
      backend: tun
      memif:
        socket: /run/vpp/memif.sock
        socketId: 1
        id: 0
        bufferSize: 2048
        burstSize: 256
        ringSize: 8192
        log2RingSize: 13
        queues: 1
  webui:
    hostname: 0.0.0.0
    port: 9999

webui:
  secretKey: change-this-open5gs-webui-secret
  jwtSecretKey: change-this-open5gs-webui-jwt-secret

vpp:
  enabled: false
  image:
    repository: vpp
    tag: "26.06"
    pullPolicy: IfNotPresent
  sriov:
    resourceName: intel.com/fabric_network
    deviceEnv: PCIDEVICE_INTEL_COM_FABRIC_NETWORK
  dpdk:
    numRxQueues: 4
    numTxQueues: 4
    numRxDesc: 4096
    numTxDesc: 4096
  memory:
    mainHeapSize: 8G
  n3:
    interfaceAddress: ""
    defaultGateway: ""
    fibTable: 10
  n6:
    interfaceAddress: 10.45.0.1/16
    externalAddress: ""
    defaultGateway: ""
    nat44:
      enabled: true
      maxSessions: "1048576"
      frameQueueNelts: 8192
      workers: "2"
  resources:
    requests:
      cpu: "8"
      memory: 16Gi
      hugepages-1Gi: 8Gi
    limits:
      cpu: "8"
      memory: 16Gi
      hugepages-1Gi: 8Gi

