{{- if dig "trace" "enabled" false .Values.monitor }}
{{- $monitor := include "xcn.componentName" (dict "root" . "component" "monitor") }}
{{- $name := printf "%s-trace-decoder" $monitor }}
{{- $colocated := eq (dig "trace" "decoderPlacement" "separate" .Values.monitor) "colocated" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  selector: {app: {{ if $colocated }}{{ $monitor }}{{ else }}{{ $name }}{{ end }}}
  ports:
    - name: http
      port: 9997
      targetPort: trace-http
{{- if not $colocated }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: {{ $name }}}
  template:
    metadata:
      labels: {app: {{ $name }}}
    spec:
      automountServiceAccountToken: false
{{- with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
{{- end }}
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: {{ include "xcn.componentName" (dict "root" . "component" "5gc") }}
              topologyKey: kubernetes.io/hostname
      containers:
{{ include "xcn.traceDecoderContainer" . | indent 8 }}
{{- end }}
{{- end }}
