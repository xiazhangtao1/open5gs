{{- if dig "trace" "enabled" false .Values.monitor }}
{{- $monitor := include "xcn.componentName" (dict "root" . "component" "monitor") }}
{{- $name := printf "%s-trace-decoder" $monitor }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  selector: {app: {{ $name }}}
  ports:
    - name: http
      port: 9997
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: {{ $name }}}
  template:
    metadata:
      labels: {app: {{ $name }}}
    spec:
      automountServiceAccountToken: false
{{- with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
{{- end }}
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: {{ include "xcn.componentName" (dict "root" . "component" "5gc") }}
              topologyKey: kubernetes.io/hostname
      containers:
        - name: decoder
          image: {{ printf "%s:%s" .Values.monitor.trace.decoderImage.repository .Values.monitor.trace.decoderImage.tag }}
          imagePullPolicy: {{ .Values.monitor.trace.decoderImage.pullPolicy }}
          env:
            - name: MONITOR_CPUSET
              value: {{ required "monitor.cpuSet is required" .Values.monitor.cpuSet | quote }}
            - name: MONITOR_URL
              value: {{ printf "http://%s:9998" $monitor | quote }}
            - name: MONITOR_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ default $monitor .Values.monitor.existingSecret }}
                  key: token
          ports:
            - name: http
              containerPort: 9997
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 15
          resources:
{{ toYaml .Values.monitor.trace.decoderResources | indent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
{{- end }}
