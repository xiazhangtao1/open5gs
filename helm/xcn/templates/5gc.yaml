            timeoutSeconds: {{ .Values.fivegc.healthProbe.timeoutSeconds }}
          resources:
{{ toYaml .Values.resources.fivegc.udm | indent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/open5gs
            - name: logs
              mountPath: /var/log/open5gs
            - name: hnet
              mountPath: /etc/open5gs/hnet
{{- include "xcn.localtimeVolumeMount" . | nindent 12 }}
        - name: udr
          image: {{ printf "%s:%s" .Values.images.runtime.repository .Values.images.runtime.tag }}
          imagePullPolicy: {{ .Values.images.runtime.pullPolicy }}
          env:
            - name: WAIT_TIMEOUT
              value: {{ .Values.fivegc.wait.timeout | quote }}
            - name: WAIT_INTERVAL
              value: {{ .Values.fivegc.wait.interval | quote }}
          command:
            - /bin/sh
            - -ec
            - |
              /usr/local/bin/wait-for-tcp.sh {{ include "xcn.componentName" (dict "root" . "component" "mongodb") }}:27017 {{ include "xcn.componentName" (dict "root" . "component" "scp") }}:7777
              exec open5gs-udrd -c /etc/open5gs/udr.yaml
{{- if not .Values.fivegc.hostNetwork.enabled }}
