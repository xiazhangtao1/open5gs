{{- $amfNgapAddress := toString .Values.networking.amf.ngap.serverAddress }}
{{- $upfN3Backend := include "xcn.upfN3Backend" . }}
{{- $upfN6Backend := include "xcn.upfN6Backend" . }}
{{- $vppEnabled := eq (include "xcn.vppEnabled" .) "true" }}
{{- $upfGtpuAddress := include "xcn.upfGtpuServerAddress" . }}
{{- $upfGtpuAdvertiseAddress := include "xcn.upfGtpuAdvertiseAddress" . }}
{{- $upfN3MemifLocalAddress := include "xcn.upfN3MemifLocalAddress" . }}
{{- if .Values.fivegc.hostNetwork.enabled }}
{{- if or (eq $amfNgapAddress "") (eq $amfNgapAddress "0.0.0.0") (eq $amfNgapAddress "::") }}
{{- fail "networking.amf.ngap.serverAddress must be an explicit node interface address when fivegc.hostNetwork.enabled=true" }}
{{- end }}
{{- if or (eq $upfGtpuAddress "") (eq $upfGtpuAddress "0.0.0.0") (eq $upfGtpuAddress "::") (eq $upfGtpuAddress "127.0.0.4") }}
{{- fail "networking.upf.n3.address (or legacy gtpu.serverAddress) must resolve to an explicit address when fivegc.hostNetwork.enabled=true" }}
{{- end }}
{{- if or (eq $upfGtpuAdvertiseAddress "") (eq $upfGtpuAdvertiseAddress "0.0.0.0") (eq $upfGtpuAdvertiseAddress "::") (eq $upfGtpuAdvertiseAddress "127.0.0.4") }}
{{- fail "networking.upf.n3.address (or legacy gtpu.advertiseAddress) must be an explicit UE-reachable address when fivegc.hostNetwork.enabled=true" }}
{{- end }}
{{- end }}
{{- if or (eq $upfGtpuAddress "0.0.0.0") (eq $upfGtpuAddress "::") (eq $upfGtpuAddress "127.0.0.4") }}
{{- fail "networking.upf.gtpu.serverAddress must be a dedicated non-wildcard address: the UPF and SMF share one pod network namespace and both use UDP/2152" }}
{{- end }}
{{- if and $vppEnabled (ne $upfN6Backend "memif") }}
{{- fail "networking.upf.n6.backend must be memif when vpp.enabled=true" }}
{{- end }}
{{- if and (eq $upfN6Backend "memif") (not $vppEnabled) }}
{{- fail "vpp.enabled must be true when networking.upf.n6.backend=memif" }}
{{- end }}
{{- if and $vppEnabled (ne $upfN3Backend "memif") }}
{{- fail "networking.upf.n3.backend must be memif when vpp.enabled=true" }}
{{- end }}
{{- if and (eq $upfN3Backend "memif") (not $vppEnabled) }}
{{- fail "vpp.enabled must be true when networking.upf.n3.backend=memif" }}
{{- end }}
{{- if $vppEnabled }}
{{- if eq $upfN3MemifLocalAddress "" }}
{{- fail "networking.upf.n3.address (or legacy n3.memif.localAddress) is required in memif mode" }}
{{- end }}
{{- if ne $upfN3MemifLocalAddress $upfGtpuAdvertiseAddress }}
{{- fail "the resolved N3 memif local address must equal the GTP-U advertise address" }}
{{- end }}
{{- if eq (toString .Values.vpp.n3.interfaceAddress) "" }}
{{- fail "vpp.n3.interfaceAddress is required when vpp.enabled=true" }}
{{- end }}
{{- if eq (toString .Values.vpp.n6.externalAddress) "" }}
{{- fail "vpp.n6.externalAddress is required when vpp.enabled=true" }}
{{- end }}
{{- end }}
