{{- include "xcn.localtimeVolumeMount" . | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "xcn.componentName" (dict "root" . "component" "config") }}
        - name: logs
          emptyDir: {}
        - name: hnet
          secret:
            secretName: {{ include "xcn.componentName" (dict "root" . "component" "udm-hnet") }}
{{- if eq $upfN6Backend "tun" }}
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
{{- else }}
        - name: vpp-templates
          configMap:
            name: {{ include "xcn.componentName" (dict "root" . "component" "config") }}
            items:
              - key: vpp-startup.conf.template
                path: startup.conf.template
              - key: vpp-vcl.conf.template
                path: vcl.conf.template
              - key: vpp-cli-commands.conf.template
                path: cli-commands.conf.template
        - name: vpp-entrypoint
          configMap:
            name: {{ include "xcn.componentName" (dict "root" . "component" "config") }}
            defaultMode: 0555
            items:
              - key: vpp-entrypoint-dual.py
                path: vpp-entrypoint-dual.py
        - name: vpp-run
          emptyDir: {}
        - name: vpp-hugepages
          emptyDir:
            medium: HugePages
