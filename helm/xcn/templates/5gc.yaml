          command:
            - /bin/sh
            - -ec
            - |
              /usr/local/bin/wait-for-tcp.sh {{ include "xcn.componentName" (dict "root" . "component" "scp") }}:7777 {{ include "xcn.componentName" (dict "root" . "component" "nrf") }}:7777
              exec open5gs-nssfd -c /etc/open5gs/nssf.yaml
{{- if not .Values.fivegc.hostNetwork.enabled }}
          ports:
