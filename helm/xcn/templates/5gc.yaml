apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "xcn.componentName" (dict "root" . "component" "5gc") }}
  labels:
    {{- include "xcn.labels" . | nindent 4 }}
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "xcn.componentName" (dict "root" . "component" "5gc") }}
  template:
    metadata:
      labels:
        app: {{ include "xcn.componentName" (dict "root" . "component" "5gc") }}
        xnet.com/cpuset-required: "true"
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
{{- if .Values.fivegc.hostNetwork.enabled }}
      hostNetwork: true
      dnsPolicy: {{ .Values.fivegc.hostNetwork.dnsPolicy | quote }}
{{- end }}
      containers:
        - name: upf
          image: {{ printf "%s:%s" .Values.images.runtime.repository .Values.images.runtime.tag }}
          imagePullPolicy: {{ .Values.images.runtime.pullPolicy }}
          env:
            - name: WAIT_TIMEOUT
              value: {{ .Values.fivegc.wait.timeout | quote }}
            - name: WAIT_INTERVAL
              value: {{ .Values.fivegc.wait.interval | quote }}
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: UPF_GTPU_SERVER_ADDRESS
              value: {{ $upfGtpuAddress | quote }}
            - name: UPF_GTPU_ADVERTISE_ADDRESS
              value: {{ $upfGtpuAdvertiseAddress | quote }}
            - name: UPF_N6_BACKEND
              value: {{ $upfN6Backend | quote }}
            - name: UPF_N3_BACKEND
              value: {{ $upfN3Backend | quote }}
          command:
            - /bin/sh
            - -ec
            - |
              UPF_GTPU_SERVER_ADDRESS="${UPF_GTPU_SERVER_ADDRESS:-$POD_IP}"
              UPF_GTPU_ADVERTISE_ADDRESS="${UPF_GTPU_ADVERTISE_ADDRESS:-$POD_IP}"
              sed \
                -e "s|__UPF_GTPU_SERVER_ADDRESS__|${UPF_GTPU_SERVER_ADDRESS}|g" \
                -e "s|__UPF_GTPU_ADVERTISE_ADDRESS__|${UPF_GTPU_ADVERTISE_ADDRESS}|g" \
                /etc/open5gs/upf.yaml.tmpl > /tmp/upf.yaml
              echo "=== rendered /tmp/upf.yaml ==="
              cat /tmp/upf.yaml
              echo "=== ip addr ==="
              ip addr
              echo "=== listeners before UPF start ==="
              ss -lntup || true
              check_udp_listener() {
                address="$1"
                port="$2"
                if ss -H -lun "sport = :${port}" | awk -v expected="${address}:${port}" -v port="${port}" '
                  {
                    bind = $(NF - 1)
                  }
                  bind == expected ||
                  bind == "0.0.0.0:" port ||
                  bind == "*:" port ||
                  bind == "[::]:" port ||
                  bind == ":::" port { found = 1 }
                  END { exit found ? 0 : 1 }
                '; then
                  echo "ERROR: UDP ${address}:${port} is already in use before UPF start" >&2
                  exit 1
                fi
              }
              check_udp_listener "${UPF_GTPU_SERVER_ADDRESS}" 2152
              check_udp_listener 127.0.0.7 8805
              if ss -H -ltn "sport = :9093" | grep -q .; then
                echo "ERROR: TCP port 9093 is already in use before UPF start" >&2
                exit 1
              fi
              /usr/local/bin/open5gs-k8s-setup
              exec open5gs-upfd -c /tmp/upf.yaml
          securityContext:
            privileged: true
            capabilities:
              add: ["NET_ADMIN"]
{{- if and (not .Values.fivegc.hostNetwork.enabled) (eq $upfN3Backend "udp") }}
          ports:
            - name: upf-gtpu
              containerPort: 2152
{{- if and .Values.hostPorts.upfGtpu.enabled (not .Values.fivegc.hostNetwork.enabled) }}
              hostPort: {{ .Values.hostPorts.upfGtpu.port }}
{{- end }}
              protocol: UDP
            - name: upf-metrics
              containerPort: 9093
              protocol: TCP
{{- end }}
          startupProbe:
            tcpSocket:
              port: 9093
            periodSeconds: {{ .Values.fivegc.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.fivegc.startupProbe.failureThreshold }}
            timeoutSeconds: {{ .Values.fivegc.startupProbe.timeoutSeconds }}
          readinessProbe:
            tcpSocket:
              port: 9093
            periodSeconds: {{ .Values.fivegc.healthProbe.readinessPeriodSeconds }}
            timeoutSeconds: {{ .Values.fivegc.healthProbe.timeoutSeconds }}
          livenessProbe:
            tcpSocket:
              port: 9093
            periodSeconds: {{ .Values.fivegc.healthProbe.livenessPeriodSeconds }}
            timeoutSeconds: {{ .Values.fivegc.healthProbe.timeoutSeconds }}
          resources:
{{ toYaml .Values.resources.fivegc.upf | indent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/open5gs
            - name: logs
              mountPath: /var/log/open5gs
{{- if eq $upfN6Backend "tun" }}
            - name: dev-net-tun
              mountPath: /dev/net/tun
{{- else }}
            - name: vpp-run
              mountPath: /run/vpp
{{- end }}
{{- include "xcn.localtimeVolumeMount" . | nindent 12 }}
{{- if $vppEnabled }}
        - name: vpp
          image: {{ printf "%s:%s" .Values.vpp.image.repository .Values.vpp.image.tag }}
          imagePullPolicy: {{ .Values.vpp.image.pullPolicy }}
          securityContext:
            privileged: true
          command: ["/usr/local/bin/vpp-entrypoint-dual.py"]
          env:
            - name: VPP_PCI_DEVICE_ENV
              value: {{ .Values.vpp.sriov.deviceEnv | quote }}
            - name: VPP_CPU_LIMIT
              valueFrom:
                resourceFieldRef:
                  containerName: vpp
                  resource: limits.cpu
                  divisor: "1"
            - name: VPP_CPU_WORKERS
              value: {{ .Values.vpp.cpu.workers | quote }}
            - name: VPP_AFFINITY_INITIAL_MODE
              value: {{ .Values.vpp.cpu.initialMode | quote }}
            - name: VPP_AFFINITY_POLL_MS
              value: {{ .Values.vpp.cpu.affinityPollMs | quote }}
            - name: VPP_CPUSET_WAIT_SECONDS
              value: {{ dig "cpusetWaitSeconds" 120 .Values.vpp.cpu | quote }}
            - name: VPP_N3_INTERFACE_ADDRESS
              value: {{ .Values.vpp.n3.interfaceAddress | quote }}
{{- if ne (toString .Values.vpp.n3.defaultGateway) "" }}
            - name: VPP_N3_DEFAULT_GATEWAY
              value: {{ .Values.vpp.n3.defaultGateway | quote }}
{{- end }}
            - name: VPP_N3_UPF_ADDRESS
              value: {{ $upfN3MemifLocalAddress | quote }}
            - name: VPP_N6_INTERFACE_ADDRESS
              value: {{ .Values.vpp.n6.externalAddress | quote }}
{{- if ne (toString .Values.vpp.n6.defaultGateway) "" }}
            - name: VPP_N6_DEFAULT_GATEWAY
              value: {{ .Values.vpp.n6.defaultGateway | quote }}
{{- end }}
            - name: VPP_TEMPLATE_DIR
              value: /etc/vpp/templates
            - name: VPP_CONFIG_DIR
              value: /run/vpp/config
          resources:
            requests:
{{ toYaml .Values.vpp.resources.requests | indent 14 }}
              {{ .Values.vpp.sriov.resourceName }}: "2"
            limits:
{{ toYaml .Values.vpp.resources.limits | indent 14 }}
              {{ .Values.vpp.sriov.resourceName }}: "2"
          readinessProbe:
            exec:
              command: ["vppctl", "-s", "/run/vpp/cli.sock", "show", "interface"]
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          volumeMounts:
            - name: vpp-entrypoint
              mountPath: /usr/local/bin/vpp-entrypoint-dual.py
              subPath: vpp-entrypoint-dual.py
              readOnly: true
            - name: vpp-templates
              mountPath: /etc/vpp/templates
              readOnly: true
            - name: vpp-run
              mountPath: /run/vpp
            - name: vpp-hugepages
              mountPath: /dev/hugepages
{{- end }}
        - name: smf
          image: {{ printf "%s:%s" .Values.images.runtime.repository .Values.images.runtime.tag }}
          imagePullPolicy: {{ .Values.images.runtime.pullPolicy }}
          env:
            - name: WAIT_TIMEOUT
              value: {{ .Values.fivegc.wait.timeout | quote }}
            - name: WAIT_INTERVAL
              value: {{ .Values.fivegc.wait.interval | quote }}
          command:
            - /bin/sh
            - -ec
            - |
              /usr/local/bin/wait-for-tcp.sh {{ include "xcn.componentName" (dict "root" . "component" "scp") }}:7777 127.0.0.1:9093
              exec open5gs-smfd -c /etc/open5gs/smf.yaml
{{- if not .Values.fivegc.hostNetwork.enabled }}
          ports:
            - name: smf-sbi
              containerPort: 7780
              protocol: TCP
            - name: smf-metrics
              containerPort: 9092
              protocol: TCP
{{- end }}
          startupProbe:
            tcpSocket:
              port: 7780
            periodSeconds: {{ .Values.fivegc.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.fivegc.startupProbe.failureThreshold }}
            timeoutSeconds: {{ .Values.fivegc.startupProbe.timeoutSeconds }}
          readinessProbe:
            tcpSocket:
              port: 7780
            periodSeconds: {{ .Values.fivegc.healthProbe.readinessPeriodSeconds }}
            timeoutSeconds: {{ .Values.fivegc.healthProbe.timeoutSeconds }}
          livenessProbe:
            tcpSocket:
              port: 7780
            periodSeconds: {{ .Values.fivegc.healthProbe.livenessPeriodSeconds }}
            timeoutSeconds: {{ .Values.fivegc.healthProbe.timeoutSeconds }}
          resources:
{{ toYaml .Values.resources.fivegc.smf | indent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/open5gs
            - name: logs
              mountPath: /var/log/open5gs
{{- include "xcn.localtimeVolumeMount" . | nindent 12 }}
        - name: amf
          image: {{ printf "%s:%s" .Values.images.runtime.repository .Values.images.runtime.tag }}
          imagePullPolicy: {{ .Values.images.runtime.pullPolicy }}
          env:
            - name: WAIT_TIMEOUT
              value: {{ .Values.fivegc.wait.timeout | quote }}
            - name: WAIT_INTERVAL
              value: {{ .Values.fivegc.wait.interval | quote }}
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: AMF_NGAP_SERVER_ADDRESS
              value: {{ .Values.networking.amf.ngap.serverAddress | quote }}
          command:
            - /bin/sh
            - -ec
            - |
              /usr/local/bin/wait-for-tcp.sh {{ include "xcn.componentName" (dict "root" . "component" "scp") }}:7777
              AMF_NGAP_SERVER_ADDRESS="${AMF_NGAP_SERVER_ADDRESS:-$HOST_IP}"
              sed "s|__AMF_NGAP_SERVER_ADDRESS__|${AMF_NGAP_SERVER_ADDRESS}|g" /etc/open5gs/amf.yaml.tmpl > /tmp/amf.yaml
              exec open5gs-amfd -c /tmp/amf.yaml
{{- if not .Values.fivegc.hostNetwork.enabled }}
          ports:
            - name: amf-sbi
              containerPort: 7779
              protocol: TCP
            - name: amf-ngap
              containerPort: 38412
{{- if and .Values.hostPorts.amfNgap.enabled (not .Values.fivegc.hostNetwork.enabled) }}
              hostPort: {{ .Values.hostPorts.amfNgap.port }}
{{- end }}
              protocol: SCTP
            - name: amf-metrics
              containerPort: 9091
              protocol: TCP
{{- end }}
          startupProbe:
            tcpSocket:
              port: 7779
            periodSeconds: {{ .Values.fivegc.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.fivegc.startupProbe.failureThreshold }}
            timeoutSeconds: {{ .Values.fivegc.startupProbe.timeoutSeconds }}
          readinessProbe:
            tcpSocket:
              port: 7779
            periodSeconds: {{ .Values.fivegc.healthProbe.readinessPeriodSeconds }}
            timeoutSeconds: {{ .Values.fivegc.healthProbe.timeoutSeconds }}
          livenessProbe:
            tcpSocket:
              port: 7779
            periodSeconds: {{ .Values.fivegc.healthProbe.livenessPeriodSeconds }}
            timeoutSeconds: {{ .Values.fivegc.healthProbe.timeoutSeconds }}
          resources:
{{ toYaml .Values.resources.fivegc.amf | indent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/open5gs
            - name: logs
              mountPath: /var/log/open5gs
{{- include "xcn.localtimeVolumeMount" . | nindent 12 }}
        - name: ausf
