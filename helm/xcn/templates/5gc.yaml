            failureThreshold: {{ .Values.fivegc.startupProbe.failureThreshold }}
            timeoutSeconds: {{ .Values.fivegc.startupProbe.timeoutSeconds }}
          readinessProbe:
            tcpSocket:
              port: 7784
            periodSeconds: {{ .Values.fivegc.healthProbe.readinessPeriodSeconds }}
            timeoutSeconds: {{ .Values.fivegc.healthProbe.timeoutSeconds }}
          livenessProbe:
            tcpSocket:
