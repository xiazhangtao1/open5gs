            - |
              /usr/local/bin/wait-for-tcp.sh {{ include "xcn.componentName" (dict "root" . "component" "scp") }}:7777
              exec open5gs-ausfd -c /etc/open5gs/ausf.yaml
{{- if not .Values.fivegc.hostNetwork.enabled }}
          ports:
            - name: ausf-sbi
              containerPort: 7781
              protocol: TCP
{{- end }}
          startupProbe:
            tcpSocket:
              port: 7781
            periodSeconds: {{ .Values.fivegc.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.fivegc.startupProbe.failureThreshold }}
            timeoutSeconds: {{ .Values.fivegc.startupProbe.timeoutSeconds }}
          readinessProbe:
            tcpSocket:
              port: 7781
            periodSeconds: {{ .Values.fivegc.healthProbe.readinessPeriodSeconds }}
            timeoutSeconds: {{ .Values.fivegc.healthProbe.timeoutSeconds }}
          livenessProbe:
            tcpSocket:
              port: 7781
            periodSeconds: {{ .Values.fivegc.healthProbe.livenessPeriodSeconds }}
            timeoutSeconds: {{ .Values.fivegc.healthProbe.timeoutSeconds }}
          resources:
{{ toYaml .Values.resources.fivegc.ausf | indent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/open5gs
            - name: logs
              mountPath: /var/log/open5gs
{{- include "xcn.localtimeVolumeMount" . | nindent 12 }}
        - name: udm
          image: {{ printf "%s:%s" .Values.images.runtime.repository .Values.images.runtime.tag }}
          imagePullPolicy: {{ .Values.images.runtime.pullPolicy }}
          env:
            - name: WAIT_TIMEOUT
