services:
  mongodb:
    image: mongo
    container_name: xcn-mongodb
    ports:
      - "27017:27017"
    restart: unless-stopped
    volumes:
      - mongodb:/data/db
      - ../docs/assets/webui/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro

  webui:
    build:
      context: ../
      dockerfile: docker/webui/Dockerfile
    image: ${USER}/xcn-webui
    container_name: xcn-webui
    depends_on:
      - mongodb
    ports:
      - "9999:9999"
    environment:
      - DB_URI=mongodb://mongodb/xcn
      - WAIT_HOSTS=mongodb:27017

  base:
    build:
      context: ./${DIST-ubuntu}/${TAG-latest}/base
      args:
        dist: ${DIST-ubuntu}
        tag: ${TAG-latest}
    image: ${USER}/${DIST-ubuntu}-${TAG-latest}-xcn-base
    command: /bin/bash -c "echo 'base' services"

  build:
    build:
      context: ../
      dockerfile: docker/build/Dockerfile
      args:
        dist: ${DIST-ubuntu}
        tag: ${TAG-latest}
        username: ${USER}
    image: ${USER}/${DIST-ubuntu}-${TAG-latest}-xcn-build
    depends_on:
      - base
    command: /bin/bash -c "echo 'build' services"

  run:
#    network_mode: "host"
    image: ${USER}/${DIST-ubuntu}-${TAG-latest}-xcn-build
    depends_on:
      - mongodb
      - build
    cap_add:
      - NET_ADMIN
    devices:
      - "/dev/net/tun:/dev/net/tun"
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
    volumes:
      - config:/etc/xcn
    hostname: xcn-run
#    command: /bin/bash -c "/root/setup.sh; /usr/bin/xcn-pcrfd -D; /usr/bin/xcn-pgwd -D; /usr/bin/xcn-sgwd -D; /usr/bin/xcn-hssd -D; /usr/bin/xcn-mmed"

  test:
    image: ${USER}/${DIST-ubuntu}-${TAG-latest}-xcn-build
    depends_on:
      - mongodb
      - build
    environment:
      - DB_URI=mongodb://mongodb/xcn
      - WAIT_HOSTS=mongodb:27017
    cap_add:
      - NET_ADMIN
    devices:
      - "/dev/net/tun:/dev/net/tun"
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
    hostname: xcn-test
    command: /bin/bash -c "/root/setup.sh; cd /xcn/build && /wait && meson test -v"

  dev:
    build:
      context: ./${DIST-ubuntu}/${TAG-latest}/dev
      args:
        dist: ${DIST-ubuntu}
        tag: ${TAG-latest}
        username: ${USER}
    image: ${USER}/${DIST-ubuntu}-${TAG-latest}-xcn-dev
    depends_on:
      - mongodb
      - base
    environment:
      - DB_URI=mongodb://mongodb/xcn
      - DISPLAY=$DISPLAY
    # - DISPLAY=host.docker.internal:0
    cap_add:
      - NET_ADMIN
    devices:
      - "/dev/net/tun:/dev/net/tun"
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
    volumes:
      - home:/home/${USER}
      - ${HOME}:/mnt
    # - /tmp/.X11-unix:/tmp/.X11-unix
    # - /etc/localtime:/etc/localtime:ro
    # - /usr/share/zoneinfo/Europe/Helsinki:/etc/localtime:ro
    hostname: xcn-dev
    user: ${USER}
    entrypoint: /bin/bash -c "/bin/bash -c \"$${@}\""
    command: |
        /bin/bash -c "
            sudo chmod 666 /dev/net/tun
            sudo /root/setup.sh
            /bin/bash || exit 0
        "
volumes:
  mongodb: {}
  home: {}
  config: {}
