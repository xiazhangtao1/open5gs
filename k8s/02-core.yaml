apiVersion: v1
kind: Service
metadata:
  name: open5gs-nrf
spec:
  selector:
    app: open5gs-core
  ports:
    - name: sbi
      port: 7777
      targetPort: nrf-sbi
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: open5gs-scp
spec:
  selector:
    app: open5gs-core
  ports:
    - name: sbi
      port: 7777
      targetPort: scp-sbi
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open5gs-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open5gs-core
  template:
    metadata:
      labels:
        app: open5gs-core
    spec:
      containers:
        - name: nrf
          image: open5gs-runtime:latest
          imagePullPolicy: IfNotPresent
          command: ["open5gs-nrfd", "-c", "/etc/open5gs/nrf.yaml"]
          ports:
            - name: nrf-sbi
              containerPort: 7777
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: nrf-sbi
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: nrf-sbi
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: nrf-sbi
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/open5gs
            - name: logs
              mountPath: /var/log/open5gs
        - name: scp
          image: open5gs-runtime:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              /usr/local/bin/wait-for-tcp.sh 127.0.0.1:7777
              exec open5gs-scpd -c /etc/open5gs/scp.yaml
          ports:
            - name: scp-sbi
              containerPort: 7778
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: scp-sbi
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: scp-sbi
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: scp-sbi
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/open5gs
            - name: logs
              mountPath: /var/log/open5gs
      volumes:
        - name: config
          configMap:
            name: open5gs-config
        - name: logs
          emptyDir: {}
