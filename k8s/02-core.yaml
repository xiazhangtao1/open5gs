apiVersion: v1
kind: Service
metadata:
  name: xcn-nrf
spec:
  selector:
    app: xcn-core
  ports:
    - name: sbi
      port: 7777
      targetPort: nrf-sbi
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: xcn-scp
spec:
  selector:
    app: xcn-core
  ports:
    - name: sbi
      port: 7777
      targetPort: scp-sbi
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xcn-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xcn-core
  template:
    metadata:
      labels:
        app: xcn-core
    spec:
      containers:
        - name: nrf
          image: xcn-runtime:latest
          imagePullPolicy: IfNotPresent
          command: ["xcn-nrfd", "-c", "/etc/xcn/nrf.yaml"]
          ports:
            - name: nrf-sbi
              containerPort: 7777
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: nrf-sbi
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: nrf-sbi
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: nrf-sbi
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/xcn
            - name: logs
              mountPath: /var/log/xcn
        - name: scp
          image: xcn-runtime:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              /usr/local/bin/wait-for-tcp.sh 127.0.0.1:7777
              exec xcn-scpd -c /etc/xcn/scp.yaml
          ports:
            - name: scp-sbi
              containerPort: 7778
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: scp-sbi
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: scp-sbi
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: scp-sbi
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/xcn
            - name: logs
              mountPath: /var/log/xcn
      volumes:
        - name: config
          configMap:
            name: xcn-config
        - name: logs
          emptyDir: {}
