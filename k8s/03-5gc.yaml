apiVersion: v1
kind: Service
metadata:
  name: xcn-upf
spec:
  selector:
    app: xcn-5gc
  ports:
    - name: pfcp
      port: 8805
      targetPort: upf-pfcp
      protocol: UDP
    - name: metrics
      port: 9090
      targetPort: upf-metrics
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: xcn-upf-n3
spec:
  type: NodePort
  selector:
    app: xcn-5gc
  ports:
    - name: gtpu
      port: 2152
      targetPort: upf-gtpu
      nodePort: 32152
      protocol: UDP
---
apiVersion: v1
kind: Service
metadata:
  name: xcn-smf
spec:
  selector:
    app: xcn-5gc
  ports:
    - name: sbi
      port: 7777
      targetPort: smf-sbi
      protocol: TCP
    - name: pfcp
      port: 8805
      targetPort: smf-pfcp
      protocol: UDP
    - name: metrics
      port: 9090
      targetPort: smf-metrics
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: xcn-amf
spec:
  selector:
    app: xcn-5gc
  ports:
    - name: sbi
      port: 7777
