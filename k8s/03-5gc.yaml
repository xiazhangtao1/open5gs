      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: amf-metrics
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: xcn-amf-ngap
spec:
  type: NodePort
  selector:
    app: xcn-5gc
  ports:
    - name: ngap
      port: 38412
      targetPort: amf-ngap
      nodePort: 31412
      protocol: SCTP
---
apiVersion: v1
kind: Service
metadata:
  name: xcn-ausf
spec:
  selector:
    app: xcn-5gc
  ports:
    - name: sbi
      port: 7777
      targetPort: ausf-sbi
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: xcn-udm
spec:
  selector:
    app: xcn-5gc
  ports:
    - name: sbi
      port: 7777
