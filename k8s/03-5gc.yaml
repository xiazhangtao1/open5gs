apiVersion: v1
kind: Service
metadata:
  name: xcn-nssf
spec:
  selector:
    app: xcn-5gc
  ports:
    - name: sbi
      port: 7777
      targetPort: nssf-sbi
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: xcn-pcf
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app: xcn-5gc
  ports:
    - name: sbi
      port: 7777
      targetPort: pcf-sbi
      protocol: TCP
      nodePort: 30777
    - name: metrics
      port: 9090
      targetPort: pcf-metrics
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xcn-5gc
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: xcn-5gc
  template:
    metadata:
      labels:
        app: xcn-5gc
    spec:
      containers:
        - name: upf
          image: xcn-runtime:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: UPF_GTPU_SERVER_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: xcn-runtime-config
                  key: UPF_GTPU_SERVER_ADDRESS
            - name: UPF_GTPU_ADVERTISE_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: xcn-runtime-config
                  key: UPF_GTPU_ADVERTISE_ADDRESS
          command:
            - /bin/sh
            - -ec
            - |
              UPF_GTPU_ADVERTISE_ADDRESS="${UPF_GTPU_ADVERTISE_ADDRESS:-$HOST_IP}"
              sed \
                -e "s|__UPF_GTPU_SERVER_ADDRESS__|${UPF_GTPU_SERVER_ADDRESS}|g" \
                -e "s|__UPF_GTPU_ADVERTISE_ADDRESS__|${UPF_GTPU_ADVERTISE_ADDRESS}|g" \
                /etc/xcn/upf.yaml.tmpl > /tmp/upf.yaml
              /usr/local/bin/xcn-k8s-setup
              exec xcn-upfd -c /tmp/upf.yaml
          securityContext:
            privileged: true
            capabilities:
              add: ["NET_ADMIN"]
          ports:
            - name: upf-pfcp
              containerPort: 8805
              protocol: UDP
            - name: upf-gtpu
              containerPort: 2152
              hostPort: 2152
              protocol: UDP
            - name: upf-metrics
              containerPort: 9093
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: upf-metrics
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: upf-metrics
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: upf-metrics
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/xcn
            - name: logs
              mountPath: /var/log/xcn
            - name: dev-net-tun
              mountPath: /dev/net/tun
        - name: smf
          image: xcn-runtime:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              /usr/local/bin/wait-for-tcp.sh xcn-scp:7777 127.0.0.1:9093
              exec xcn-smfd -c /etc/xcn/smf.yaml
          ports:
            - name: smf-sbi
              containerPort: 7780
              protocol: TCP
            - name: smf-pfcp
              containerPort: 8806
              protocol: UDP
            - name: smf-metrics
              containerPort: 9092
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: smf-sbi
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: smf-sbi
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: smf-sbi
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/xcn
            - name: logs
              mountPath: /var/log/xcn
        - name: amf
          image: xcn-runtime:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: AMF_NGAP_SERVER_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: xcn-runtime-config
                  key: AMF_NGAP_SERVER_ADDRESS
          command:
            - /bin/sh
            - -ec
            - |
              /usr/local/bin/wait-for-tcp.sh xcn-scp:7777
              sed "s|__AMF_NGAP_SERVER_ADDRESS__|${AMF_NGAP_SERVER_ADDRESS}|g" /etc/xcn/amf.yaml.tmpl > /tmp/amf.yaml
              exec xcn-amfd -c /tmp/amf.yaml
          ports:
            - name: amf-sbi
              containerPort: 7779
              protocol: TCP
            - name: amf-ngap
              containerPort: 38412
              hostPort: 38412
              protocol: SCTP
            - name: amf-metrics
              containerPort: 9091
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: amf-sbi
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: amf-sbi
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: amf-sbi
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/xcn
            - name: logs
              mountPath: /var/log/xcn
        - name: ausf
          image: xcn-runtime:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              /usr/local/bin/wait-for-tcp.sh xcn-scp:7777
              exec xcn-ausfd -c /etc/xcn/ausf.yaml
          ports:
            - name: ausf-sbi
              containerPort: 7781
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: ausf-sbi
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: ausf-sbi
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: ausf-sbi
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/xcn
            - name: logs
              mountPath: /var/log/xcn
        - name: udm
          image: xcn-runtime:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              /usr/local/bin/wait-for-tcp.sh xcn-scp:7777
              exec xcn-udmd -c /etc/xcn/udm.yaml
          ports:
            - name: udm-sbi
              containerPort: 7782
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: udm-sbi
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: udm-sbi
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: udm-sbi
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/xcn
            - name: logs
              mountPath: /var/log/xcn
            - name: hnet
              mountPath: /etc/xcn/hnet
        - name: udr
          image: xcn-runtime:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              /usr/local/bin/wait-for-tcp.sh xcn-mongodb:27017 xcn-scp:7777
              exec xcn-udrd -c /etc/xcn/udr.yaml
          ports:
            - name: udr-sbi
              containerPort: 7783
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: udr-sbi
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: udr-sbi
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: udr-sbi
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/xcn
            - name: logs
              mountPath: /var/log/xcn
        - name: nssf
          image: xcn-runtime:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              /usr/local/bin/wait-for-tcp.sh xcn-scp:7777 xcn-nrf:7777
              exec xcn-nssfd -c /etc/xcn/nssf.yaml
          ports:
            - name: nssf-sbi
              containerPort: 7784
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: nssf-sbi
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: nssf-sbi
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: nssf-sbi
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/xcn
            - name: logs
              mountPath: /var/log/xcn
        - name: pcf
          image: xcn-runtime:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              /usr/local/bin/wait-for-tcp.sh xcn-mongodb:27017 xcn-scp:7777
              exec xcn-pcfd -c /etc/xcn/pcf.yaml
          ports:
            - name: pcf-sbi
              containerPort: 7785
              protocol: TCP
            - name: pcf-metrics
              containerPort: 9094
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: pcf-sbi
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: pcf-sbi
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: pcf-sbi
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/xcn
            - name: logs
              mountPath: /var/log/xcn
      volumes:
        - name: config
          configMap:
            name: xcn-config
        - name: logs
          emptyDir: {}
        - name: hnet
          secret:
            secretName: xcn-udm-hnet
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
