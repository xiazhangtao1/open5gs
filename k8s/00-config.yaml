apiVersion: v1
kind: ConfigMap
metadata:
  name: open5gs-mongo-init
data:
  mongo-init.js: |
    db = db.getSiblingDB('open5gs')
    cursor = db.accounts.find()
    if (cursor.count() == 0) {
        db.accounts.insertOne({
            salt: 'f5c15fa72622d62b6b790aa8569b9339729801ab8bda5d13997b5db6bfc1d997',
            hash: '',
            username: 'admin',
            roles: [ 'admin' ],
            "__v": 0
        })
    }
---
apiVersion: v1
kind: Secret
metadata:
  name: open5gs-webui-env
type: Opaque
stringData:
  .env: |
    SECRET_KEY=change-this-open5gs-webui-secret
    JWT_SECRET_KEY=change-this-open5gs-webui-jwt-secret
