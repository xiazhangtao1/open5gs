apiVersion: v1
kind: ConfigMap
metadata:
  name: open5gs-config
data:
  nrf.yaml: |
    logger:
      file:
        path: /var/log/open5gs/nrf.log
    global:
      max:
        ue: 1024
    nrf:
      serving:
        - plmn_id:
            mcc: 999
            mnc: 70
      sbi:
        server:
          - address: 0.0.0.0
            port: 7777
            advertise: open5gs-nrf
  scp.yaml: |
    logger:
      file:
        path: /var/log/open5gs/scp.log
    global:
      max:
        ue: 1024
    scp:
      sbi:
        server:
          - address: 0.0.0.0
            port: 7778
            advertise: open5gs-scp:7777
        client:
          nrf:
            - uri: http://127.0.0.1:7777
  amf.yaml.tmpl: |
    logger:
      file:
        path: /var/log/open5gs/amf.log
    global:
      max:
        ue: 1024
    amf:
      sbi:
        server:
          - address: 0.0.0.0
            port: 7779
            advertise: open5gs-amf:7777
        client:
          scp:
            - uri: http://open5gs-scp:7777
      ngap:
        server:
          - address: __AMF_NGAP_SERVER_ADDRESS__
      metrics:
        server:
          - address: 0.0.0.0
            port: 9091
      guami:
        - plmn_id:
            mcc: 999
            mnc: 70
          amf_id:
            region: 2
            set: 1
      tai:
        - plmn_id:
            mcc: 999
            mnc: 70
          tac: 1
      plmn_support:
        - plmn_id:
            mcc: 999
            mnc: 70
          s_nssai:
            - sst: 1
      security:
        integrity_order: [ NIA2, NIA1, NIA0 ]
        ciphering_order: [ NEA0, NEA1, NEA2 ]
      network_name:
        full: Open5GS
        short: Next
      amf_name: open5gs-amf0
      time:
        t3512:
          value: 540
  smf.yaml: |
    logger:
      file:
        path: /var/log/open5gs/smf.log
    global:
      max:
        ue: 1024
    smf:
      sbi:
        server:
          - address: 0.0.0.0
            port: 7780
            advertise: open5gs-smf:7777
        client:
          scp:
            - uri: http://open5gs-scp:7777
      pfcp:
        server:
          - address: 0.0.0.0
            port: 8806
            advertise: 127.0.0.1
        client:
          upf:
            - address: 127.0.0.1
      gtpc:
        server:
          - address: 0.0.0.0
            port: 2124
      gtpu:
        server:
          - address: 0.0.0.0
            port: 2153
      metrics:
        server:
          - address: 0.0.0.0
            port: 9092
      session:
        - subnet: 10.45.0.0/16
          gateway: 10.45.0.1
        - subnet: 2001:db8:cafe::/48
          gateway: 2001:db8:cafe::1
      dns:
        - 8.8.8.8
        - 8.8.4.4
        - 2001:4860:4860::8888
        - 2001:4860:4860::8844
      mtu: 1400
  upf.yaml.tmpl: |
    logger:
      file:
        path: /var/log/open5gs/upf.log
    global:
      max:
        ue: 1024
    upf:
      pfcp:
        server:
          - address: 0.0.0.0
            advertise: open5gs-upf
      gtpu:
        server:
          - address: __UPF_GTPU_SERVER_ADDRESS__
            advertise: __UPF_GTPU_ADVERTISE_ADDRESS__
      session:
        - subnet: 10.45.0.0/16
          gateway: 10.45.0.1
        - subnet: 2001:db8:cafe::/48
          gateway: 2001:db8:cafe::1
      metrics:
        server:
          - address: 0.0.0.0
            port: 9093
  ausf.yaml: |
    logger:
      file:
        path: /var/log/open5gs/ausf.log
    global:
      max:
        ue: 1024
    ausf:
      sbi:
        server:
          - address: 0.0.0.0
            port: 7781
            advertise: open5gs-ausf:7777
        client:
          scp:
            - uri: http://open5gs-scp:7777
  udm.yaml: |
    logger:
      file:
        path: /var/log/open5gs/udm.log
    global:
      max:
        ue: 1024
    udm:
      hnet:
        - id: 1
          scheme: 1
          key: /etc/open5gs/hnet/curve25519-1.key
        - id: 2
          scheme: 2
          key: /etc/open5gs/hnet/secp256r1-2.key
        - id: 3
          scheme: 1
          key: /etc/open5gs/hnet/curve25519-3.key
        - id: 4
          scheme: 2
          key: /etc/open5gs/hnet/secp256r1-4.key
        - id: 5
          scheme: 1
          key: /etc/open5gs/hnet/curve25519-5.key
        - id: 6
          scheme: 2
          key: /etc/open5gs/hnet/secp256r1-6.key
      sbi:
        server:
          - address: 0.0.0.0
            port: 7782
            advertise: open5gs-udm:7777
        client:
          scp:
            - uri: http://open5gs-scp:7777
  udr.yaml: |
    db_uri: mongodb://open5gs-mongodb/open5gs
    logger:
      file:
        path: /var/log/open5gs/udr.log
    global:
      max:
        ue: 1024
    udr:
      sbi:
        server:
          - address: 0.0.0.0
            port: 7783
            advertise: open5gs-udr:7777
        client:
          scp:
            - uri: http://open5gs-scp:7777
  nssf.yaml: |
    logger:
      file:
        path: /var/log/open5gs/nssf.log
    global:
      max:
        ue: 1024
    nssf:
      sbi:
        server:
          - address: 0.0.0.0
            port: 7784
            advertise: open5gs-nssf:7777
        client:
          scp:
            - uri: http://open5gs-scp:7777
          nsi:
            - uri: http://open5gs-nrf:7777
              s_nssai:
                sst: 1
  pcf.yaml: |
    db_uri: mongodb://open5gs-mongodb/open5gs
    logger:
      file:
        path: /var/log/open5gs/pcf.log
    global:
      max:
        ue: 1024
    pcf:
      sbi:
        server:
          - address: 0.0.0.0
            port: 7785
            advertise: open5gs-pcf:7777
        client:
          scp:
            - uri: http://open5gs-scp:7777
      metrics:
        server:
          - address: 0.0.0.0
            port: 9094
---
